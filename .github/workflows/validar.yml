name: Validar entrega
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  banco-e-contratos:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: camaleao_test_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
        env:
          # Disposable local test service; not a production credential.
          DB_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/camaleao_test_ci
      - name: Build da interface quando presente
        run: |
          if test -f src/main.ts; then
            npm run build
            npm run build:demo
          fi
      - run: npm audit --audit-level=high
      - name: Manifesto público sem segredos
        run: python3 scripts/check-public.py
  interface:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verificar camada de interface
        id: camada
        run: |
          if test -f playwright.config.ts; then echo "presente=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.camada.outputs.presente == 'true'
        with:
          node-version: '24'
          cache: npm
      - if: steps.camada.outputs.presente == 'true'
        run: npm ci --ignore-scripts
      - if: steps.camada.outputs.presente == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.camada.outputs.presente == 'true'
        run: npm run test:ui
